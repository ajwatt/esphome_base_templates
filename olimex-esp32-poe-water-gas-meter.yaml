substitutions:
  # For water one of: CCF, ft³, gal, L, m³
  # For gas one of: CCF, ft³, m³
  volume_unit: 'gal'
  # Set to false only if needed during manual calibration.
  # Do not keep them at false since these slow down the ESP device
  # and reduce the accuracy during high flow.
  hide_magnetic_field_strength_sensors: 'true'
  hide_half_rotations_total_sensor: 'true'

  gpio_led: GPIO04

  device_class1: 'gas'
  device_class2: 'water'

  device_icon1: 'mdi:meter-gas'
  device_icon2: 'mdi:water'

  volume_unit1: 'ft³'
  volume_unit2: 'gal'

  prefix1_name: 'Gas '
  prefix1_id: 'gas_'
  prefix2_name: 'Water '
  prefix2_id: 'water_'

  i2c1_sda: GPIO01
  i2c1_scl: GPIO03
  i2c2_sda: GPIO32
  i2c2_scl: GPIO33

  flow_update_interval_seconds1: '35'
  flow_update_interval_seconds2: '15'

esphome:
  name: ${devicename}
  friendly_name: ${friendlyname}
  min_version: 2024.11.0
  name_add_mac_suffix: false

esp32:
  board: esp32dev
  framework:
    type: esp-idf

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
#  clk_mode: GPIO17_OUT
  clk:
    pin: GPIO17
    mode: CLK_OUT
  phy_addr: 0
  power_pin:
    number: GPIO12
    ignore_strapping_warning: true

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Allow Over-The-Air updates
ota:
- platform: esphome
  password: !secret ota_password

#wifi:
#  ssid: !secret wifi_ssid
#  password: !secret wifi_password
#captive_portal:
